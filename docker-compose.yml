services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: inventory
      MYSQL_USER: inventory
      MYSQL_PASSWORD: inventory
      MYSQL_ROOT_PASSWORD: root
    ports: ['3306:3306']
    volumes: [inventory_mysql:/var/lib/mysql]
    healthcheck:
      test: ['CMD', 'mysqladmin', 'ping', '-h', 'localhost']
      interval: 5s
      timeout: 5s
      retries: 20
  backend:
    build: { context: ., dockerfile: server/Dockerfile }
    environment:
      DATABASE_URL: mysql://inventory:inventory@mysql:3306/inventory
      USE_DATABASE: 'true'
      PORT: 4000
      CLIENT_URL: http://localhost:5173
    ports: ['4000:4000']
    depends_on:
      mysql: { condition: service_healthy }
  frontend:
    build: { context: ., dockerfile: Dockerfile }
    ports: ['5173:80']
    depends_on: [backend]
volumes:
  inventory_mysql:
